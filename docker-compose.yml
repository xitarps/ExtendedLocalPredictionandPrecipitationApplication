services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    expose:
      - '6379'
    environment:
      TERM: xterm-256color

  db:
    image: postgres:18
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-America/Fortaleza}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
      TERM: ${TERM:-xterm-256color}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql

  web:
    build: .
    stdin_open: true
    tty: true
    user: root
    entrypoint: ["./config/setup_app.sh"]
    command: ["bash", "-c", "./bin/rails s -p 3000 -b '0.0.0.0'"]
    environment:
      TZ: America/Fortaleza
      TERM: xterm-256color
      BUNDLE_WITHOUT: ""
      BUNDLE_DEPLOYMENT: "0"
    env_file:
      - ./.env
    volumes:
      - .:/home/app/web
    working_dir: /home/app/web
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: .
    user: root
    entrypoint: ["./config/setup_app.sh"]
    command: ["bash", "./worker/entrypoint.sh"]
    environment:
      TZ: America/Fortaleza
      TERM: xterm-256color
      BUNDLE_WITHOUT: ""
      BUNDLE_DEPLOYMENT: "0"
    env_file:
      - ./.env
    volumes:
      - .:/home/app/web
    working_dir: /home/app/web
    depends_on:
      - db
      - redis

volumes:
  pgdata:
